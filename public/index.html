<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS5 Pro Availability Checker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      color: #333;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .status-text {
      color: #666;
    }

    .refresh-button {
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .refresh-button:hover {
      background: #5568d3;
    }

    .refresh-button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result-card {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .result-card.available {
      border-color: #ff9800;
      background: #fff8f0;
    }

    .result-card.unavailable {
      border-color: #f44336;
      background: #fef3f2;
    }

    .result-card.loading {
      border-color: #2196f3;
      background: #f3f9ff;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }

    .result-name {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge.available {
      background: #ff9800;
      color: white;
    }

    .status-badge.unavailable {
      background: #f44336;
      color: white;
    }

    .status-badge.loading {
      background: #2196f3;
      color: white;
    }

    .status-badge.error {
      background: #ff9800;
      color: white;
    }

    .result-url {
      margin-bottom: 10px;
    }

    .result-url a {
      color: #667eea;
      text-decoration: none;
      word-break: break-all;
      font-size: 13px;
      transition: color 0.2s;
    }

    .result-url a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    .result-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #999;
    }

    .loading-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #667eea;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: #fff3cd;
      border: 1px solid #ffc107;
      color: #856404;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 10px;
    }

    .no-data {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎮 PS5 Pro Availability</h1>
      <p class="subtitle">Check availability across multiple retailers</p>
    </header>

    <div class="status">
      <span class="status-text">
        Last updated: <strong id="lastUpdated">Never</strong>
      </span>
      <button class="refresh-button" id="refreshBtn" onclick="manualRefresh()">
        🔄 Check Now
      </button>
      <button class="refresh-button" id="soundBtn" onclick="playNotificationSound()" style="margin-left: 10px;">
        🔊 Test Sound
      </button>
    </div>

    <div class="results" id="resultsContainer">
      <div class="no-data">
        <div class="loading-spinner"></div>
        <p>Loading availability...</p>
      </div>
    </div>
  </div>

  <script>
    const UPDATE_INTERVAL = 5 * 60 * 1000;
    let isRefreshing = false;
    let previousResults = [];

    async function fetchAvailability() {
      try {
        const response = await fetch('/api/availability');
        if (!response.ok) throw new Error('Failed to fetch');

        const data = await response.json();
        checkForAlerts(data.results);
        displayResults(data.results);
        updateLastScraped(data.lastScraped);
        previousResults = data.results;
      } catch (error) {
        console.error('Error fetching availability:', error);
        displayError('Failed to load availability data');
      }
    }

    function checkForAlerts(currentResults) {
      if (!previousResults || previousResults.length === 0) return;

      for (const current of currentResults) {
        const previous = previousResults.find(r => r.name === current.name);
        if (!previous) continue;

        // Check if product became available below 1000 euro
        if (!previous.available && current.available && current.price && current.price < 1000) {
          triggerAlert(current);
        }
      }
    }

    function triggerAlert(product) {
      // Browser alert
      alert(`🎮 PS5 PRO AVAILABLE!\n\n${product.name}\nPrice: €${product.price.toFixed(2)}\n\nClick OK to visit the store.`);
      
      // Browser notification
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('PS5 Pro Available! 🎮', {
          body: `${product.name} - €${product.price.toFixed(2)}`,
          icon: '🎮',
          tag: 'ps5-alert',
          requireInteraction: true
        });
      }

      // Play sound notification
      playNotificationSound();
    }

    function playNotificationSound() {
      try {
        // Create audio context with user gesture handling
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioContext = new AudioContext();
        
        // Resume audio context if it's suspended (due to browser autoplay policy)
        if (audioContext.state === 'suspended') {
          audioContext.resume().then(() => {
            playSoundWithContext(audioContext);
          });
        } else {
          playSoundWithContext(audioContext);
        }
      } catch (e) {
        console.log('Could not play notification sound:', e);
      }
    }

    function playSoundWithContext(audioContext) {
      try {
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        // Create a more noticeable alert sound (two beeps)
        oscillator.frequency.value = 1000;
        oscillator.type = 'sine';

        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.2);

        // Second beep
        const oscillator2 = audioContext.createOscillator();
        oscillator2.connect(gainNode);
        oscillator2.frequency.value = 1200;
        oscillator2.type = 'sine';

        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + 0.3);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

        oscillator2.start(audioContext.currentTime + 0.3);
        oscillator2.stop(audioContext.currentTime + 0.5);
      } catch (e) {
        console.log('Error playing sound:', e);
      }
    }

    // Request notification permission on load
    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function displayResults(results) {
      const container = document.getElementById('resultsContainer');

      if (!results || results.length === 0) {
        container.innerHTML = `
          <div class="no-data">
            <p>No results yet. Waiting for first scrape...</p>
          </div>
        `;
        return;
      }

      container.innerHTML = results.map(result => `
        <div class="result-card ${getStatusClass(result)}">
          <div class="result-header">
            <span class="result-name">${result.name}</span>
            <span class="status-badge ${getStatusClass(result)}">
              ${getStatusText(result)}
            </span>
          </div>
          <div class="result-url">
            <a href="${result.url}" target="_blank" rel="noopener noreferrer">
              Visit Store →
            </a>
          </div>
          <div class="result-price" style="margin-bottom: 10px; font-weight: 600; color: #333;">
            ${result.price !== null ? `€${result.price.toFixed(2)}` : 'Price not available'}
            ${result.exceedsMaxPrice ? `<span style="color: #f44336; margin-left: 10px;">(Exceeds €${result.maxPrice})</span>` : ''}
          </div>
          <div class="result-footer">
            <span>Checked: ${formatTime(result.lastChecked)}</span>
            ${result.error ? `<span style="color: #ff9800;">⚠ ${result.error}</span>` : ''}
          </div>
          ${result.error && !result.success ? `
            <div class="error-message">
              Error: ${result.error}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function displayError(message) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = `
        <div class="no-data">
          <p>❌ ${message}</p>
        </div>
      `;
    }

    function getStatusClass(result) {
      if (!result.success) return 'error';
      return result.available ? 'available' : 'unavailable';
    }

    function getStatusText(result) {
      if (!result.success) return 'Error';
      return result.available ? 'Available' : 'Out of Stock';
    }

    function formatTime(isoString) {
      if (!isoString) return 'N/A';
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function updateLastScraped(timestamp) {
      const element = document.getElementById('lastUpdated');
      if (timestamp) {
        element.textContent = formatTime(timestamp);
      } else {
        element.textContent = 'Never';
      }
    }

    async function manualRefresh() {
      if (isRefreshing) return;

      isRefreshing = true;
      const btn = document.getElementById('refreshBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> Checking...';

      try {
        const response = await fetch('/api/scrape-now');
        if (!response.ok) throw new Error('Failed to scrape');

        const data = await response.json();
        checkForAlerts(data.results);
        displayResults(data.results);
        updateLastScraped(data.timestamp);
        previousResults = data.results;
      } catch (error) {
        console.error('Error during manual refresh:', error);
        displayError('Failed to check availability');
      } finally {
        isRefreshing = false;
        btn.disabled = false;
        btn.innerHTML = '🔄 Check Now';
      }
    }

    async function startAutoRefresh() {
      requestNotificationPermission();
      await fetchAvailability();
      setInterval(fetchAvailability, UPDATE_INTERVAL);
    }

    document.addEventListener('DOMContentLoaded', startAutoRefresh);
  </script>
</body>
</html>
